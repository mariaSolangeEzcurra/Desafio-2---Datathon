version: '3.8'

services:
  # Servicio 1: La Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: sedapar_db
    restart: always
    environment:
      POSTGRES_USER: admin_sedapar
      POSTGRES_PASSWORD: password_seguro_2026
      POSTGRES_DB: db_operaciones_sedapar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_sedapar -d db_operaciones_sedapar"]
      interval: 3s
      timeout: 5s
      retries: 5

  # Servicio 2: Tu Backend en FastAPI
  backend:
    build: ./backend
    container_name: sedapar_backend
    restart: "no"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin_sedapar:password_seguro_2026@db:5432/db_operaciones_sedapar
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: